# Two items split 2:1 (A and B): two item holds on one step, for the reject-withdraws-siblings test.
mock: 1
rules:
  - item: A
    replicate: [1, 2]
    judgment: {label: abundant, confidence: high, rationale: "mean {mean_value}"}
  - item: A
    replicate: 3
    judgment: {label: uniform, confidence: medium, supporting: [mean_value, sd_value], rationale: "sd {sd_value} is small enough"}
  - item: B
    replicate: [1, 2]
    judgment: {label: sparse, confidence: high, rationale: "mean {mean_value}"}
  - item: B
    replicate: 3
    judgment: {label: uniform, confidence: medium, supporting: [mean_value, sd_value], rationale: "sd {sd_value} is small"}
  - item: C
    judgment: {label: variable, confidence: high, rationale: "sd {sd_value}"}
