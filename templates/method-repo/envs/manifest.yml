# Environment manifest (design 10.3). One entry per env name used by module.yml files.
# local executor: `lock` names the lockfile under envs/<name>/, hashed as the environment digest,
#   and `uv sync` (or `renv::restore()`) in that directory builds the environment the modules run in.
# apptainer executor: `image` (a .sif by file name, resolved under the site's images_root, or a
#   path) and its sha256. A method that runs on a laptop as well as the workstation names both.
# The two example environments below are the template's (`envs/example-py/`, `envs/example-r/`);
# rename or remove them with their directories.
environments:
  example-py:
    lock: envs/example-py/uv.lock
  example-r:
    lock: envs/example-r/renv.lock
