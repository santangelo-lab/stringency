policy: 1
version: 0.1.0
# what this method needs installed; checked by lint, declare --check, init and run open (engine 0.2.19)
requires:
  engine: '>=0.2.19'
  # plugins:
  #   stringency-<domain>: '>=<version>'   # the plugin this method's pipelines name as their domain
invariant: [repro.*, topo.*]
profiles:
  strict:
    remap: {flag: block}
    params: locked
    replicates_min: 3
    agreement: standard
    qc_ranges: strict
    relayed_review: false
    open: {exec: refused, exec_timeout_s: 3600}   # open mode is refused with strict at init
  standard:
    remap: {}
    params: ranged
    replicates_min: 3
    agreement: standard
    qc_ranges: standard
    relayed_review: true
    open: {exec: allowed, exec_timeout_s: 3600}   # a session script may run under the executor
  exploratory:
    remap: {block: flag}
    params: free
    replicates_min: 3
    agreement: relaxed
    qc_ranges: wide
    relayed_review: true
    open: {exec: allowed, exec_timeout_s: 3600}
overrides: {}
ranges: {}
confidence_criteria:
  high:   {min_supporting: 3, max_contradicting: 0}
  medium: {min_supporting: 2, max_contradicting: 1}
  low:    {min_supporting: 1}
agreement:
  standard: {hold_on: [label_disagreement, any_abstain, any_low, any_invalid]}
  relaxed:  {hold_on: [label_disagreement, all_abstain, any_invalid]}
