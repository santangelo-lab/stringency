repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-biology-imports
        name: engine imports no biology
        entry: scripts/check_no_biology.sh
        language: script
        pass_filenames: false
